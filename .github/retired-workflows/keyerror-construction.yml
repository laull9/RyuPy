# 三图五角色独立门；原percent与所有旧保护仍同HEAD独立运行。
name: KeyError默认builtins完整构造同源验收
on:
  workflow_call:
permissions:
  contents: read
jobs:
  treebuilder-state:
    # 根selector只准精确新标题；本job无needs，原KeyError红不阻塞它。
    if: "github.event.head_commit.message == 'validation: treebuilder-state-001'"
    uses: ./.github/workflows/treebuilder.yml
  keyerror-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 构建前纯控制自测与全部冻结输入校验
        timeout-minutes: 2
        run: |
          python3 -B -m unittest discover -s scripts -p keyerror_construction_selftest.py
          python3 -B -m unittest discover -s scripts -p re_scanner_selftest.py
          python3 -B -m unittest discover -s scripts -p textwrap_dedent_selftest.py
          python3 -B -m unittest discover -s tests/validation -p distribution_metadata_selftest.py
          python3 -B -m unittest discover -s tests/validation/generator_product -p test_diagnostic_once.py
      - name: 原固定官方工具准备双流
        timeout-minutes: 10
        run: |
          mkdir -p target/keyerror-construction-prepare
          printf '%s\n' '["python3", "-B", "tests/aot/wcwidth_ci/prepare.py"]' > target/keyerror-construction-prepare/argv.json
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py > target/keyerror-construction-prepare/stdout 2> target/keyerror-construction-prepare/stderr || status=$?
          printf '%s\n' "$status" > target/keyerror-construction-prepare/exit
          exit "$status"
      - name: 普通CLI、五C#与六Rust、真实PE及五角色CP/JIT
        timeout-minutes: 45
        run: '"$PYTHON" -B scripts/keyerror_construction_validation.py --phase jit'
      - name: Native前保存原流与TRX和实际PE
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyerror-checkpoint-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/keyerror-construction-evidence/*.json
            target/keyerror-construction-evidence/*.stdout
            target/keyerror-construction-evidence/*.stderr
            target/keyerror-construction-evidence/trx*
            target/keyerror-construction-evidence/products
            target/keyerror-construction-evidence/inputs
            target/keyerror-construction-prepare
          if-no-files-found: warn
          retention-days: 3
      - name: 重核同源工具后真实ILC及撤编译输入原位和搬移
        # 仅决定有无state可读；脚本仍先重核HEAD/tree/全部SHA和产品路径，不能恢复旧pass。
        if: ${{ !cancelled() && hashFiles('target/keyerror-construction-evidence/state.json') != '' }}
        timeout-minutes: 85
        run: '"$PYTHON" -B scripts/keyerror_construction_validation.py --phase native'
      - name: 失败仍保全部小证据与唯一候选源码
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyerror-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/keyerror-construction-evidence
            !target/keyerror-construction-evidence/tools/**
            !target/keyerror-construction-evidence/**/native-build/**
            !target/keyerror-construction-evidence/**/relocated/**
            !target/keyerror-construction-evidence/**/native-dist.tar.gz
            target/keyerror-construction-prepare
            ${{ runner.temp }}/wcwidth-aot-tools/download-identity.json
          if-no-files-found: error
          retention-days: 3
      - name: 失败前实际ELF归档与唯一同轮工具
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyerror-tools-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/keyerror-construction-evidence/tools
            target/keyerror-construction-evidence/**/native-dist.tar.gz
          if-no-files-found: warn
          retention-days: 3
      - name: 明确有限支持与旧保护口径
        if: always()
        run: |
          printf '%s\n' '## KeyError三图五角色；整体失败不自动升级' \
            '20个预期产品进程：5 CP、5 JIT、5 Native原位、5搬移；缺失或失败保红。' \
            '本job普通无pilot CLI，原percent job仍为同HEAD pilot CLI，二进制身份分开记录。' \
            '仅owner显式Instance，consumer必须Legacy；真实计划和PE调用核验后才计结构通过。' \
            '原百分号33704B全流与五row、旧消费者、Scanner红、202B attr_list、77B Markdown、固定20、双make check及S1均独立保留。' \
            '原1699公开ABI逐项保留，仅加LoadDefaultBuiltin精确一条；Native生产guard没有放宽。' >> "$GITHUB_STEP_SUMMARY"
