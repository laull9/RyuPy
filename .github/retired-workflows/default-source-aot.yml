# 默认来源AOT独立门；不让新域失败阻断固定20/旧Native/ABI/S1。
name: 默认来源真实NativeAOT
on:
  workflow_call:
permissions:
  contents: read
jobs:
  default-source-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 先运行检查器纯反例
        timeout-minutes: 2
        run: python3 -B -m unittest discover -s tests/aot/default_source_aot -p 'test_*.py'
      - name: 固定官方工具准备
        timeout-minutes: 10
        run: |
          mkdir -p target/default-source-aot-prepare
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py > target/default-source-aot-prepare/stdout 2> target/default-source-aot-prepare/stderr || status=$?
          printf '%s\n' "$status" > target/default-source-aot-prepare/exit
          exit "$status"
      - name: 同源PE与managed前置及严格Native搬迁
        timeout-minutes: 65
        run: '"$PYTHON" -B tests/aot/default_source_aot/run.py'
      - name: 失败保完整原流和小产物
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-source-aot-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/default-source-aot-evidence
            !target/default-source-aot-evidence/tools/**
            !target/default-source-aot-evidence/native-build/**
            !target/default-source-aot-evidence/relocated/**
            !target/default-source-aot-evidence/**/native-dist.tar.gz
            target/default-source-aot-prepare
            ${{ runner.temp }}/wcwidth-aot-tools/download-identity.json
          if-no-files-found: warn
          retention-days: 3
      - name: 单份实际Native与工具
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-source-aot-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/default-source-aot-evidence/tools
            target/default-source-aot-evidence/**/native-dist.tar.gz
          if-no-files-found: warn
          retention-days: 3
      - name: 明确有限域与原始失败
        if: always()
        run: |
          printf '%s\n' '默认公开build入口；3ELF/8Native，普通JIT单独4进程。' \
            'CP黄金有来源；Outside/Deferred/finder NI与CP正例分账。' \
            '旧metadata红例/显式缺资源/资源数据/20项目/S1/ABI均不豁免。' \
            '任一失败保原件，不补采；不是全包数据/全部trim或全面AOT支持。' >> "$GITHUB_STEP_SUMMARY"
