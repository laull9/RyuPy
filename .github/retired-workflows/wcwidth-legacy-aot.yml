  source-import-paths:
    name: 普通Import路径C#早门及原include反例JIT
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false' && needs.select-mode.outputs.markdown == 'false' && needs.select-mode.outputs.closure != 'true'
    runs-on: ubuntu-24.04
