# 同一runner真实应用A/B；源码、正确性、启动/构建/体积/RSS边界独立记录。
name: pyfiglet Native文本热点优化对照
on:
  workflow_dispatch:
  push:
    branches: ['ci/native-join-perf-20261113-001']
permissions:
  contents: read
concurrency:
  group: native-text-index-perf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'validation: native-join-perf-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      PYTHONNOUSERSITE: '1'
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b6d92e951350c8640bfce740328fd58c369fa2c1
          path: before-source
          persist-credentials: false
      - name: 固定工具与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libicu-dev
          python3 -B tests/aot/wcwidth_ci/prepare.py
      - name: 配对统计与完整原流轻量合同
        run: '"$PYTHON" -B -m unittest discover -s tests/aot/native_text_index_perf -p "test_*.py"'
      - name: 两份公开Native与五类负载对照
        timeout-minutes: 70
        run: '"$PYTHON" -B tests/aot/native_text_index_perf/run.py'
      - name: 成功与失败原件
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-text-index-perf-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-text-index-perf
          if-no-files-found: warn
          retention-days: 3
