# 隔离探针验收；不修改日常CI，不代表MIR或NativeAOT性能验收。
name: Records probe experiment
on:
  push:
    branches: [work/records-probe-ci-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  records-probe:
    if: github.ref == 'refs/heads/work/records-probe-ci-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      UseSharedCompilation: 'false'
    steps:
      # jobs.env没有runner上下文；先在shell建立目录，再跨步骤传递路径。
      - name: Prepare isolated evidence directory
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/records-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          printf 'run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$EVIDENCE/run.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze evidence identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD | tee "$EVIDENCE/commit.txt"
          test "$(cat "$EVIDENCE/commit.txt")" = "$GITHUB_SHA"
          # GitHub集成可重建提交SHA；核完整源码树而非本地祖先身份。
          # 仅剔除本次验证新增的三个文件，其他任意源码变化均令树校验失败。
          export GIT_INDEX_FILE="$RUNNER_TEMP/records-source-index"
          git read-tree HEAD
          git update-index --force-remove .github/workflows/records-probe-experiment.yml tests/perf/check_records_probe_evidence.py tests/perf/test_records_probe_evidence.py
          git write-tree | tee "$EVIDENCE/source-tree.txt"
          test "$(cat "$EVIDENCE/source-tree.txt")" = '7a2a3d208cbf91de2f3f35d0861dcc5da44a3865'
          unset GIT_INDEX_FILE
          printf '%s\n' '{"sdk":{"version":"10.0.403","rollForward":"disable","allowPrerelease":false}}' > global.json
          cp global.json "$EVIDENCE/global.json"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Verify SDK and compile actual runtime tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version | tee "$EVIDENCE/sdk.txt"
          test "$(cat "$EVIDENCE/sdk.txt")" = '10.0.403'
          dotnet --info > "$EVIDENCE/dotnet-info.txt"
          dotnet build runtime/RyuPy.Runtime.Tests/RyuPy.Runtime.Tests.csproj -c Release 2>&1 | tee "$EVIDENCE/build.log"
      - name: Execute all records probe cases and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          dotnet test runtime/RyuPy.Runtime.Tests/RyuPy.Runtime.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~RyuPy.Runtime.Tests.PyDictStringPairProbeTests' --logger 'trx;LogFileName=records.trx' --logger 'console;verbosity=detailed' --results-directory "$EVIDENCE" 2>&1 | tee "$EVIDENCE/test.log"
      - name: Reject missing skipped or incomplete evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python3 -B tests/perf/test_records_probe_evidence.py 2>&1 | tee "$EVIDENCE/checker-selftest.log"
          python3 -B tests/perf/check_records_probe_evidence.py "$EVIDENCE" "$GITHUB_SHA" 2>&1 | tee "$EVIDENCE/verification.log"
      - name: Upload raw evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-probe-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
