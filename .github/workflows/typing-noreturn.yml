# 同提交本地复用的NoReturn独立验收；仅由原总workflow精确标题调用，不提供dispatch。
name: NoReturn同候选产品验收
on:
  workflow_call:
permissions:
  contents: read
jobs:
  typing-noreturn:
    name: NoReturn同候选C#及真实JIT与Native和Markdown阶段
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 新控制流和旧selector纯自测
        run: |
          python3 -B -m unittest discover -s tests/validation -p test_typing_noreturn.py
          python3 -B tests/validation/markdown_preflight.py --self-test
          python3 -B -m unittest discover -s tests/validation/generator_product -p test_diagnostic_once.py
      - name: 固定官方Rust SDK CP工具并保原流
        run: |
          mkdir -p target/typing-noreturn-prepare
          printf '%s\n' '["python3", "-B", "tests/aot/wcwidth_ci/prepare.py"]' > target/typing-noreturn-prepare/argv.json
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py > target/typing-noreturn-prepare/stdout 2> target/typing-noreturn-prepare/stderr || status=$?
          printf '%s\n' "$status" > target/typing-noreturn-prepare/exit
          exit "$status"
      - name: C#早门与一次工具构建后真实产品分阶段
        run: '"$PYTHON" -B tests/validation/typing_noreturn.py'
      - name: 失败仍保小原证据及PE与清单，排除大工具与Native
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typing-noreturn-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/typing-noreturn-evidence
            !target/typing-noreturn-evidence/tools/**
            !target/typing-noreturn-evidence/native-dist.tar.gz
            !target/typing-noreturn-evidence/native-build/**
            !target/typing-noreturn-evidence/relocated/**
            target/typing-noreturn-prepare
            ${{ runner.temp }}/wcwidth-aot-tools/download-identity.json
          if-no-files-found: error
          retention-days: 3
      - name: 独立保CLI工具，避免核Native时下载137MB工具包
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typing-noreturn-tools-${{ github.sha }}-${{ github.run_attempt }}
          path: target/typing-noreturn-evidence/tools
          if-no-files-found: error
          retention-days: 3
      - name: 仅保执行前完整Native归档，不重复原位或搬移副本
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typing-noreturn-native-${{ github.sha }}-${{ github.run_attempt }}
          path: target/typing-noreturn-evidence/native-dist.tar.gz
          # 早门/publish未到成功时可缺归档；原runner失败仍使job失败，不改失败判定。
          if-no-files-found: warn
          retention-days: 3
