# 仅验证隔离数值列表候选，不修改dev，也不将Runtime合同当作AOT性能验收。
name: Numeric reverse only source AOT experiment
on:
  push:
    branches: [ci/numeric-reverse-only-20261115]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      UseSharedCompilation: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 选择独立SDK安装目录
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/numeric-list-dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.13'
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: 固定环境并记录身份
        env:
          FIXED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/numeric-list-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/numeric-list-evidence" >> "$GITHUB_ENV"
          echo "PYTHON=$FIXED_PYTHON" >> "$GITHUB_ENV"
          echo "RYUPY_FOREACH_PYTHON=$FIXED_PYTHON" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/numeric-list-evidence/source.txt"
          # 独立安装目录避免runner自带较新SDK被默认选择，保留门禁失败时的实际版本。
          dotnet --info > "$RUNNER_TEMP/numeric-list-evidence/dotnet.txt"
          dotnet --version | tee "$RUNNER_TEMP/numeric-list-evidence/sdk.txt"
          test "$(readlink -f "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR/dotnet"
          test "$(dotnet --version)" = 10.0.403
          for key in DOTNET DOTNET_HOST_PATH; do echo "$key=$DOTNET_INSTALL_DIR/dotnet" >> "$GITHUB_ENV"; done
          for key in DOTNET_ROOT DOTNET_ROOT_X64; do echo "$key=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"; done
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> "$GITHUB_ENV"
          "$FIXED_PYTHON" -c 'import sys; assert sys.version_info[:3] == (3,12,13); print(sys.version)' > "$RUNNER_TEMP/numeric-list-evidence/python.txt"
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev patchelf binutils time
      - name: 固定旧dev独立构建
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/numeric-base" 81758bb477729aee4636f2ca6d6b0815b949849a
          git -C "$RUNNER_TEMP/numeric-base" rev-parse HEAD HEAD^{tree} > "$EVIDENCE/base.txt"
          (cd "$RUNNER_TEMP/numeric-base"; CARGO_TARGET_DIR="$RUNNER_TEMP/numeric-target-base" make build RELEASE_DIR="$RUNNER_TEMP/numeric-cli-base") 2>&1 | tee "$EVIDENCE/base-build.log"
          rm -rf -- "$RUNNER_TEMP/numeric-target-base"
      - name: 候选结构门与独立构建
        run: |
          set -euo pipefail
          cargo fmt --all --check
          NUMERIC_EVIDENCE="$EVIDENCE/structure" CARGO_TARGET_DIR="$RUNNER_TEMP/numeric-target" cargo test -p ryupy-driver --test numeric_list_lifecycle -- --ignored 2>&1 | tee "$EVIDENCE/structure.log"
          CARGO_TARGET_DIR="$RUNNER_TEMP/numeric-target" make check DOTNET_TEST_ARGS="--logger 'trx;LogFileName=runtime.trx' --results-directory '$EVIDENCE/full'" 2>&1 | tee "$EVIDENCE/full-check.log"
          dotnet test runtime/RyuPy.Runtime.Tests -c Release --filter FullyQualifiedName~PyNumericListReorderTests --logger 'trx;LogFileName=focused.trx' --results-directory "$EVIDENCE" 2>&1 | tee "$EVIDENCE/focused.log"
          "$PYTHON" - <<'PY_CHECK'
          import os, pathlib, xml.etree.ElementTree as E
          rows = E.parse(pathlib.Path(os.environ["EVIDENCE"]) / "focused.trx").getroot().findall(".//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult")
          assert len(rows) == 5 and all(r.get("outcome") == "Passed" for r in rows)
          PY_CHECK
          CARGO_TARGET_DIR="$RUNNER_TEMP/numeric-target" make build RELEASE_DIR="$RUNNER_TEMP/numeric-cli-candidate" 2>&1 | tee "$EVIDENCE/candidate-build.log"
          rm -rf -- "$RUNNER_TEMP/numeric-target"
      - name: 固定CP与双臂JIT AOT搬迁及四轮冷进程验证
        run: |
          set -euo pipefail
          "$PYTHON" -B tests/perf/numeric-list/validate.py "$EVIDENCE/product" --old "$RUNNER_TEMP/numeric-cli-base/ryupy" --new "$RUNNER_TEMP/numeric-cli-candidate/ryupy" 2>&1 | tee "$EVIDENCE/product.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-product-${{ github.sha }}
          path: ${{ runner.temp }}/numeric-list-evidence
          if-no-files-found: error
          retention-days: 14
