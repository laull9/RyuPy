# 独立离线验包三平台真实项目验收；不把清单自洽当签名或运行兼容证明。
name: 真实应用离线发行包验证
on:
  workflow_dispatch:
  push:
    branches: [integration/aot-distribution-verify-20261113, integration/dev-schema9-verify-20261113]
permissions:
  contents: read
concurrency:
  group: distribution-verify-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONOPTIMIZE: '0'
  PYTHONNOUSERSITE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_UI_LANGUAGE: en-US
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  UseSharedCompilation: 'false'
jobs:
  verify-distribution:
    if: github.ref == 'refs/heads/integration/aot-distribution-verify-20261113' || github.ref == 'refs/heads/integration/dev-schema9-verify-20261113'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.4'
          enable-cache: false
      - name: 固定CP（POSIX）
        if: runner.os != 'Windows'
        run: |
          uv python install 3.12.13
          echo "PYTHON=$(uv python find 3.12.13 --managed-python)" >> "$GITHUB_ENV"
      - name: 固定CP（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv python install 3.12.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = uv python find 3.12.13 --managed-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 选择已安装x64 Visual C++
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "RYUPY_VSROOT="
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "RYUPY_VSROOT=%%I"
          if not defined RYUPY_VSROOT exit /b 1
          call "%RYUPY_VSROOT%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          "%PYTHON%" -c "import os; keys={'path','include','lib','libpath','vcinstalldir','vctoolsinstalldir','windowssdkdir','windowssdkversion','ucrtversion','universalcrtsdkdir'}; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.writelines(k+'='+v+'\n' for k,v in os.environ.items() if k.lower() in keys); f.close()"
      - name: 一次性Windows runner长路径准备
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git config --global --get core.longpaths
          if ($LASTEXITCODE -ne 0 -or $actual -ne 'true') { throw 'Git long paths not enabled' }
          $shortCargoHome = Join-Path $env:RUNNER_TEMP 'c'
          New-Item -ItemType Directory -Force -Path $shortCargoHome | Out-Null
          "CARGO_HOME=$shortCargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "core.longpaths=$actual; CARGO_HOME=$shortCargoHome"
      - name: Linux原生工具依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: 固定工具与锁定真实项目
        id: prepare
        shell: python
        timeout-minutes: 30
        run: |
          import os, pathlib, subprocess, sys
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'distribution-verify'
          command = [os.environ['PYTHON'], '-B', str(repo/'tests/aot/distribution_verify/setup.py'), '--base', str(root)]
          sys.exit(subprocess.call(command, cwd=repo))
      - name: 公开构建与离线搬迁验包负例
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: python
        timeout-minutes: 45
        env:
          VERIFY_RID: ${{ matrix.rid }}
        run: |
          import os, pathlib, subprocess, sys
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'distribution-verify'
          command = [os.environ['PYTHON'], '-B', str(repo/'tests/aot/distribution_verify/run.py'), '--base', str(root), '--rid', os.environ['VERIFY_RID']]
          with (root/'run.stdout').open('wb') as out, (root/'run.stderr').open('wb') as err:
              result = subprocess.run(command, cwd=root, stdout=out, stderr=err)
          sys.exit(result.returncode)
      - name: 保存准备原件与总结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-verify-shared-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution-verify/setup.json
            ${{ runner.temp }}/distribution-verify/global.json
            ${{ runner.temp }}/distribution-verify/logs
            ${{ runner.temp }}/distribution-verify/tools
            ${{ runner.temp }}/distribution-verify/sentinels
            ${{ runner.temp }}/distribution-verify/sources
            ${{ runner.temp }}/distribution-verify/sources-hidden
            ${{ runner.temp }}/distribution-verify/projects
            ${{ runner.temp }}/distribution-verify/projects-hidden
            ${{ runner.temp }}/distribution-verify/run.stdout
            ${{ runner.temp }}/distribution-verify/run.stderr
            ${{ runner.temp }}/distribution-verify/raw/result.json
            ${{ runner.temp }}/distribution-verify/raw/source-trees-before.json
            ${{ runner.temp }}/distribution-verify/raw/source-trees-after.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: 保存pyfiglet原始流及所有验包副本
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-verify-raw-pyfiglet-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ runner.temp }}/distribution-verify/raw/pyfiglet
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: 保存pyfigletSDK及发布原件
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-verify-sdk-pyfiglet-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution-verify/builds/pyfiglet
            ${{ runner.temp }}/distribution-verify/builds-hidden/pyfiglet
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: 保存binaryornot原始流及所有验包副本
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-verify-raw-binaryornot-${{ matrix.rid }}-${{ github.sha }}
          path: ${{ runner.temp }}/distribution-verify/raw/binaryornot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: 保存binaryornotSDK及发布原件
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-verify-sdk-binaryornot-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution-verify/builds/binaryornot
            ${{ runner.temp }}/distribution-verify/builds-hidden/binaryornot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
