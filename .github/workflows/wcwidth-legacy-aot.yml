# 保留 Legacy 门禁；显式 Instance AOT 独立资格/PE门和两产物，不扩大自动选择。
name: wcwidth 原四调用 Legacy NativeAOT
on:
  push:
    branches: [ci/wcwidth-legacy-aot-2909056]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wcwidth-legacy-aot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select-mode:
    name: 精确选择诊断或原验收链
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      diagnostic: ${{ steps.mode.outputs.diagnostic }}
    steps:
      # Actions字符串比较不区分大小写，因此不以表达式==冒充标题字节精确匹配。
      # 不checkout、不执行仓库源码、不把提交消息插入shell；普通提交/dispatch保持原链。
      - id: mode
        run: |
          python3 - <<'PY'
          import json
          import os
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)
          head = event.get('head_commit')
          diagnostic = (
              os.environ.get('GITHUB_EVENT_NAME') == 'push'
              and os.environ.get('GITHUB_REF') == 'refs/heads/ci/wcwidth-legacy-aot-2909056'
              and event.get('ref') == 'refs/heads/ci/wcwidth-legacy-aot-2909056'
              and isinstance(head, dict)
              and head.get('message') == 'diagnostic-not-acceptance: trace-v1-first-edge-001'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('diagnostic=' + str(diagnostic).lower() + '\n')
          PY
  trace-edge-diagnostic:
    name: diagnostic-not-acceptance 首边原流
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && github.event_name == 'push' && needs.select-mode.outputs.diagnostic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 单次诊断runner纯mock自测
        run: python3 -B -m unittest discover -s tests/validation/generator_product -p test_diagnostic_once.py
      - name: 仅准备同版固定SHA官方Rust组件
        run: |
          mkdir -p target/trace-v1-edge-prepare
          printf '%s\n' '["python3", "-B", "tests/aot/wcwidth_ci/prepare.py", "--rust-only"]' > target/trace-v1-edge-prepare/prepare.argv.json
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py --rust-only > target/trace-v1-edge-prepare/prepare.stdout 2> target/trace-v1-edge-prepare/prepare.stderr || status=$?
          printf '%s\n' "$status" > target/trace-v1-edge-prepare/prepare.exit
          exit "$status"
      - name: 一次普通CLI构建、三个诊断测试、原A编译60秒（预期仍E0310）
        run: python3 -B tests/validation/generator_product/diagnostic_once.py
      - name: 明示本轮全门not-run
        if: always()
        run: |
          printf '%s\n' '## diagnostic-not-acceptance' \
            '本轮只采一次原A编译拒绝。无产品运行，不是验收通过。' \
            'not-run: CP fixtures、B/C/D/HOT、NativeAOT、原Rust验收组、S2、S1、full make check、20 projects、Legacy baseline与dynamic frames。' \
            '这些门本轮略过，既有失败状态与accepted不改变。' >> "$GITHUB_STEP_SUMMARY"
      - name: 保留首次诊断失败原流（不是产品验收）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-not-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/trace-v1-edge-diagnostic
            target/trace-v1-edge-prepare
            ${{ runner.temp }}/wcwidth-rust-tools/download-identity.json
          if-no-files-found: error
          retention-days: 3
  baseline:
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      UNICODE_VERSION: latest
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 官方 v4，2026-11-07 核验
        with:
          persist-credentials: false
      - name: 核验固定官方工具下载
        run: |
          mkdir -p target/wcwidth-aot-evidence
          python3 tests/aot/wcwidth_ci/prepare.py 2>&1 | tee target/wcwidth-aot-evidence/prepare.log
      - name: 发布前格式硬门
        timeout-minutes: 3
        run: |
          status=0
          cargo fmt --all --check > target/wcwidth-aot-evidence/preflight-fmt.stdout 2> target/wcwidth-aot-evidence/preflight-fmt.stderr || status=$?
          printf '%s\n' "$status" > target/wcwidth-aot-evidence/preflight-fmt.exit
          cat target/wcwidth-aot-evidence/preflight-fmt.stdout
          cat target/wcwidth-aot-evidence/preflight-fmt.stderr >&2
          exit "$status"
      - name: 检查 hosted Linux 原生编译依赖
        run: |
          command -v clang
          command -v readelf
          command -v ldd
          dpkg-query -W zlib1g-dev
      - name: 原四调用、真实 publish、ELF 与搬移
        id: legacy
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/run.py'
      - name: 实际来源新消费者Native原位、搬移与源码隔离
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        timeout-minutes: 30
        run: '"$PYTHON" -B tests/validation/source_provenance/ci/bootstrap.py native'
      - name: 原A/B/HOT无flag及显式V1整流（同源工具，历史红灯不覆写）
        id: generator_product_v1
        if: ${{ !cancelled() && hashFiles('target/wcwidth-aot-evidence/compiler-identity.json') != '' }}
        timeout-minutes: 68
        run: '"$PYTHON" -B tests/validation/generator_product/bootstrap.py'
      - name: 普通CLI域外与同候选Legacy API完整对照
        if: ${{ !cancelled() && steps.generator_product_v1.outcome == 'success' }}
        timeout-minutes: 21
        run: '"$PYTHON" -B tests/validation/generator_default/default_gate.py'
      - name: 显式Instance资格与PE前置、两Native产物及隔离搬迁
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/instance_gate.py'
      - name: 显式super三分合同与独立Legacy Native及隔离搬迁
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/explicit_super_gate.py'
      - name: 既有Kind1 JIT与Kind2资源AOT及搬移
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        run: '"$PYTHON" -B tests/aot/resource_smoke.py --ryupy "$PWD/target/debug/ryupy" --python "$PYTHON" --dotnet "$DOTNET" --rid linux-x64 --out target/resource-ci-evidence'
      - name: Legacy动态生成器独立前置与综合Native合同
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/generator_dynamic_gate.py'
      - name: 保留成功或首次失败证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 官方 v4，2026-11-07 核验
        with:
          name: wcwidth-legacy-aot-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/wcwidth-aot-evidence
            target/source-provenance-native
            !target/source-provenance-native/publish/product/**
            target/instance-aot-evidence
            target/explicit-super-evidence
            target/generator-dynamic-evidence
            target/generator-product-evidence
            target/generator-default-evidence
            target/generator-product-bootstrap/*.json
            target/generator-product-bootstrap/*.stdout
            target/generator-product-bootstrap/*.stderr
            target/generator-product-bootstrap/decoder
            target/resource-ci-evidence/**/logs/**
            target/resource-ci-evidence/**/result.json
          if-no-files-found: warn
          retention-days: 3
  full-check:
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mode: [default, pilot]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 固定官方工具
        run: |
          mkdir -p target/wcwidth-aot-evidence
          python3 tests/aot/wcwidth_ci/prepare.py 2>&1 | tee target/wcwidth-aot-evidence/prepare.log
      - name: 取固定旧运行时用于S1 ABI比对
        if: matrix.mode == 'default'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bd5d7dbe1f09bd3ba649e9b1c1928845784e4fe8
          path: target/trace-s1-baseline
          persist-credentials: false
      - name: 独立S1事务和真实PE门
        if: matrix.mode == 'default'
        id: trace_s1
        continue-on-error: true
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/trace_state_s1.py'
      - name: 完整make check及脚本门禁
        env:
          CHECK_MODE: ${{ matrix.mode }}
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/full_check.py'
      - name: 强制S1专用门结果
        if: always() && matrix.mode == 'default'
        env:
          TRACE_S1_OUTCOME: ${{ steps.trace_s1.outcome }}
        run: test "$TRACE_S1_OUTCOME" = success
      - name: 保存完整检查原流
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-check-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/full-check-evidence
            target/trace-state-s1-evidence
            target/foreach-new-run/**/*.bin
            target/foreach-new-run/**/status.json
            target/foreach-new-run/**/summary.json
            target/foreach-new-run/**/result.json
            target/foreach-new-run/**/manifest.json
            target/foreach-new-run/**/diagnostics.txt
            target/foreach-new-run/**/compile-meta.json
            target/foreach-new-run/**/module-plan.json
            target/wcwidth-aot-evidence/prepare.log
          retention-days: 3
  projects:
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 固定官方工具
        run: |
          mkdir -p target/wcwidth-aot-evidence
          python3 tests/aot/wcwidth_ci/prepare.py 2>&1 | tee target/wcwidth-aot-evidence/prepare.log
      - name: 固定20项pilot编译配置默认JIT逐ID保护
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/project_gate.py'
      - name: 保存项目证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: project-preserve-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/project-ci-evidence
            target/wcwidth-aot-evidence/prepare.log
          retention-days: 3
  trace-adapter-s2:
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 固定官方工具（仅hosted）
        run: |
          mkdir -p target/wcwidth-aot-evidence
          python3 tests/aot/wcwidth_ci/prepare.py 2>&1 | tee target/wcwidth-aot-evidence/prepare.log
      - name: 六JIT及三Native配置轻量Build与检查器预门
        id: managed_preflight
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/trace_adapter_s2.py'
      - name: 三例专用静态入口NativeAOT及搬迁最小环境
        if: ${{ success() && steps.managed_preflight.outcome == 'success' }}
        run: '"$PYTHON" -B tests/aot/wcwidth_ci/trace_adapter_native_s2.py'
      - name: 保留S2a实际原流和隔离产物
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-adapter-s2-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/trace-adapter-s2/*.json
            target/trace-adapter-s2/*.stdout
            target/trace-adapter-s2/*.stderr
            target/trace-adapter-s2/trx
            target/trace-adapter-s2/trx-native
            target/trace-adapter-s2/native-preflight
            target/trace-adapter-native-s2
            target/trace-adapter-s2/observed
            target/trace-adapter-s2/generated
            target/trace-adapter-s2/default-generated
            target/trace-adapter-s2/hosts/**/bin
            target/trace-adapter-s2/probe-runtime/bin
            target/trace-adapter-s2/default-runtime/bin
            target/wcwidth-aot-evidence/prepare.log
          if-no-files-found: error
          retention-days: 3

  trace-rust-preflight:
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust前置采集与结果聚合器自测
        run: python3 -B -m unittest discover -s tests/aot/wcwidth_ci -p 'test_trace*.py'
      - name: 无flag产品与域外脚本纯mock门
        run: |
          python3 -B -m unittest discover -s tests/validation/generator_product -p 'test_*.py'
          python3 -B -m unittest discover -s tests/validation/generator_default -p 'test_*.py'
      - name: 仅准备固定SHA的官方Rust组件
        run: |
          mkdir -p target/trace-rust-prepare
          printf '%s\n' '["python3", "-B", "tests/aot/wcwidth_ci/prepare.py", "--rust-only"]' > target/trace-rust-prepare/prepare.argv.json
          pwd > target/trace-rust-prepare/prepare.cwd
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py --rust-only > target/trace-rust-prepare/prepare.stdout 2> target/trace-rust-prepare/prepare.stderr || status=$?
          printf '%s\n' "$status" > target/trace-rust-prepare/prepare.exit
          cat target/trace-rust-prepare/prepare.stdout
          cat target/trace-rust-prepare/prepare.stderr >&2
          exit "$status"
      - name: 格式、MIR资格与default/pilot结构Rust测试（无产品执行）
        run: python3 -B tests/aot/wcwidth_ci/trace_rust_preflight.py
      - name: 保留首次Rust检查原流与精确身份
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-rust-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/trace-rust-preflight
            target/trace-rust-prepare
            ${{ runner.temp }}/wcwidth-rust-tools/download-identity.json
          if-no-files-found: error
          retention-days: 3

  pyfiglet-explicit-deployment:
    name: 原pyfiglet显式外置字体有界部署
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 脚本纯合成自测（无CP/产品/构建）
        run: python3 -B -m unittest discover -s tests/aot/pyfiglet_ci -p 'test_*.py'
      - name: 复用固定官方CP与SDK准备
        run: |
          mkdir -p target/pyfiglet-prepare
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py > target/pyfiglet-prepare/stdout 2> target/pyfiglet-prepare/stderr || status=$?
          printf '%s\n' "$status" > target/pyfiglet-prepare/exit
          exit "$status"
      - name: 一次CP与两JIT、唯一发布和四次Native
        run: '"$PYTHON" -B tests/aot/pyfiglet_ci/run.py'
      - name: 首次失败也收件完整原流、真实dist及发布树
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pyfiglet-explicit-deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/pyfiglet-deployment-evidence
            target/pyfiglet-prepare
            ${{ runner.temp }}/wcwidth-aot-tools/download-identity.json
          if-no-files-found: error
          retention-days: 3

  source-import-paths:
    name: 普通Import路径C#早门及原include反例JIT
    needs: select-mode
    if: github.ref == 'refs/heads/ci/wcwidth-legacy-aot-2909056' && needs.select-mode.outputs.diagnostic == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 判定器纯合成自测（不启动产品）
        run: python3 -B -m unittest discover -s tests/validation/source_import_paths -p 'test_*.py'
      - name: 复用固定官方CP与SDK准备
        run: |
          mkdir -p target/source-import-prepare
          status=0
          python3 -B tests/aot/wcwidth_ci/prepare.py > target/source-import-prepare/stdout 2> target/source-import-prepare/stderr || status=$?
          printf '%s\n' "$status" > target/source-import-prepare/exit
          exit "$status"
      - name: 一次C#构建与定向测试、原反例两JIT及路径/caller JIT
        run: '"$PYTHON" -B tests/validation/source_import_paths/gate.py'
      - name: 来源判定器纯合成自测（不启动产品）
        run: python3 -B -m unittest discover -s tests/validation/source_provenance/ci -p 'test_*.py'
      - name: 固定同树旧源码，仅供真实host对照
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7545eae82270797cbac2da68e996a7a8a5ba98af
          path: target/source-provenance-baseline
          persist-credentials: false
      - name: 来源Runtime、原J1/J2、新语义与旧新host一次闭环
        timeout-minutes: 30
        run: '"$PYTHON" -B tests/validation/source_provenance/ci/bootstrap.py jit'
      - name: 保留首次失败原流及实际托管产物
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-import-paths-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/source-import-path-evidence
            target/source-provenance-evidence
            !target/source-provenance-evidence/host/old/graph/**/RyuPy.Runtime.dll
            target/source-import-prepare
            ${{ runner.temp }}/wcwidth-aot-tools/download-identity.json
          if-no-files-found: error
          retention-days: 3
