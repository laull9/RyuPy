          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success' && fromJSON(steps.package.outputs.count) >= 9
        with:
          name: integrated-part-09-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-parts/part-09.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success' && fromJSON(steps.package.outputs.count) >= 10
        with:
          name: integrated-part-10-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-parts/part-10.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success' && fromJSON(steps.package.outputs.count) >= 11
        with:
          name: integrated-part-11-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-parts/part-11.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success' && fromJSON(steps.package.outputs.count) >= 12
        with:
          name: integrated-part-12-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-parts/part-12.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
