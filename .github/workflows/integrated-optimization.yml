          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success' && fromJSON(steps.package.outputs.count) >= 8
        with:
          name: integrated-part-08-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-parts/part-08.bin
          compression-level: 0
