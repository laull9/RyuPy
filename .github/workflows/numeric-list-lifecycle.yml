# 仅验证隔离数值列表候选，不修改dev，也不将Runtime合同当作AOT性能验收。
name: Numeric list lifecycle candidate
on:
  push:
    branches: [ci/numeric-list-lifecycle-20261115]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      UseSharedCompilation: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 选择独立SDK安装目录
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/numeric-list-dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.13'
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: 固定环境并记录身份
        env:
          FIXED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/numeric-list-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/numeric-list-evidence" >> "$GITHUB_ENV"
          echo "PYTHON=$FIXED_PYTHON" >> "$GITHUB_ENV"
          echo "RYUPY_FOREACH_PYTHON=$FIXED_PYTHON" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/numeric-list-evidence/source.txt"
          # 独立安装目录避免runner自带较新SDK被默认选择，保留门禁失败时的实际版本。
          dotnet --info > "$RUNNER_TEMP/numeric-list-evidence/dotnet.txt"
          dotnet --version | tee "$RUNNER_TEMP/numeric-list-evidence/sdk.txt"
          test "$(readlink -f "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR/dotnet"
          test "$(dotnet --version)" = 10.0.403
          for key in DOTNET DOTNET_HOST_PATH; do echo "$key=$DOTNET_INSTALL_DIR/dotnet" >> "$GITHUB_ENV"; done
          for key in DOTNET_ROOT DOTNET_ROOT_X64; do echo "$key=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"; done
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> "$GITHUB_ENV"
          "$FIXED_PYTHON" -c 'import sys; assert sys.version_info[:3] == (3,12,13); print(sys.version)' > "$RUNNER_TEMP/numeric-list-evidence/python.txt"
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev patchelf binutils
      - name: 五项新增Runtime合同
        run: |
          set -euo pipefail
          dotnet test runtime/RyuPy.Runtime.Tests -c Release --filter FullyQualifiedName~PyNumericListReorderTests --logger 'trx;LogFileName=focused.trx' --results-directory "$EVIDENCE" 2>&1 | tee "$EVIDENCE/focused.log"
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as E
          root = E.parse(pathlib.Path(os.environ['EVIDENCE']) / 'focused.trx').getroot()
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          results = root.findall('.//t:UnitTestResult', ns)
          assert len(results) == 5, len(results)
          assert all(r.get('outcome') == 'Passed' for r in results)
          print('five numeric-list contracts passed')
          PY
      - name: 完整默认检查
        run: |
          set -euo pipefail
          make check DOTNET_TEST_ARGS="--logger 'trx;LogFileName=runtime.trx' --results-directory '$EVIDENCE/full'" 2>&1 | tee "$EVIDENCE/full-check.log"
          echo COMPLETE > "$EVIDENCE/complete.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-list-${{ github.sha }}
          path: ${{ runner.temp }}/numeric-list-evidence
          if-no-files-found: error
          retention-days: 14
