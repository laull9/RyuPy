# 专用产品实验分支；不并入dev，不改变默认CI。
name: List performance confirmation
on:
  push:
    branches: [work/list-performance-confirm-20261115]
permissions:
  contents: read
concurrency:
  group: list-performance-confirm
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_TERM_COLOR: never
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      UseSharedCompilation: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 准备隔离目录与固定基线
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/list-confirm-evidence"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/list-confirm-dotnet" >> "$GITHUB_ENV"
          echo "BASE=$RUNNER_TEMP/list-confirm-base" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$EVIDENCE/harness.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/list-confirm-base" 81758bb477729aee4636f2ca6d6b0815b949849a
          git -C "$RUNNER_TEMP/list-confirm-base" rev-parse HEAD > "$EVIDENCE/base.txt"
          git worktree add --detach "$RUNNER_TEMP/list-confirm-candidate" 7980e75650f1873de9bb37476ff47f47b9ae0bf3
          git -C "$RUNNER_TEMP/list-confirm-candidate" rev-parse HEAD > "$EVIDENCE/candidate.txt"
          echo "CANDIDATE=$RUNNER_TEMP/list-confirm-candidate" >> "$GITHUB_ENV"
          df -h > "$EVIDENCE/disk-before.txt"
          lscpu > "$EVIDENCE/cpu.txt"
          uname -a > "$EVIDENCE/kernel.txt"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.13'
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: 固定工具链与本机依赖
        timeout-minutes: 15
        env:
          FIXED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.403
          test "$(readlink -f "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR/dotnet"
          "$FIXED_PYTHON" -c 'import sys,os; assert sys.version_info[:3] == (3,12,13); assert os.path.isabs(sys.executable); print(sys.version)' | tee "$EVIDENCE/python.txt"
          echo "PYTHON=$FIXED_PYTHON" >> "$GITHUB_ENV"
          echo "RYUPY_FOREACH_PYTHON=$FIXED_PYTHON" >> "$GITHUB_ENV"
          # 产品driver优先读取DOTNET，不能仅依靠PATH上的dotnet版本。
          for key in DOTNET DOTNET_HOST_PATH; do echo "$key=$DOTNET_INSTALL_DIR/dotnet" >> "$GITHUB_ENV"; done
          for key in DOTNET_ROOT DOTNET_ROOT_X64; do echo "$key=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"; done
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> "$GITHUB_ENV"
          dotnet --info > "$EVIDENCE/dotnet.txt"
          dotnet --version > "$EVIDENCE/sdk.txt"
          "$FIXED_PYTHON" --version > "$EVIDENCE/python.txt"
          rustc --version > "$EVIDENCE/rust.txt"
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev patchelf binutils
      - name: 复测门禁轻测
        run: "$PYTHON -B tests/perf/list-confirm/test_report.py"
      - name: 固定原两源冻结CLI
        timeout-minutes: 60
        run: |
          set -euo pipefail
          for arm in base candidate; do
            source="$BASE"
            if [ "$arm" = candidate ]; then source="$CANDIDATE"; fi
            (cd "$source"; CARGO_TARGET_DIR="$RUNNER_TEMP/confirm-$arm-target" make build RELEASE_DIR="$RUNNER_TEMP/frozen-$arm") 2>&1 | tee "$EVIDENCE/$arm-build.log"
            rm -rf -- "$RUNNER_TEMP/confirm-$arm-target"
          done
          df -h > "$EVIDENCE/disk-after-build.txt"
      - name: 六项三轮每臂15样本且第二轮交换编译臂
        timeout-minutes: 240
        run: |
          set -euo pipefail
          dotnet build-server shutdown
          for round in 1 2 3; do
            folder="$EVIDENCE/round-$round"
            mkdir -p "$folder"
            old="$RUNNER_TEMP/frozen-base/ryupy"; new="$RUNNER_TEMP/frozen-candidate/ryupy"
            if [ "$round" = 2 ]; then old="$RUNNER_TEMP/frozen-candidate/ryupy"; new="$RUNNER_TEMP/frozen-base/ryupy"; fi
            "$PYTHON" -B tests/perf/aot_hotspot_pair.py --only list_ops,matmul,containers,sieve,closures,decorators --old "$old" --new "$new" --python "$PYTHON" --runs 15 --manifest-evidence "$folder/manifests" --min-free-gib 4 --cleanup-completed --output "$folder/paired.json" 2>&1 | tee "$folder/performance.log"
          done
          "$PYTHON" -B tests/perf/list-confirm/report.py "$EVIDENCE" | tee "$EVIDENCE/study.log"
          echo COMPLETE > "$EVIDENCE/complete.txt"
      - name: 总是保留各轮原始与失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: list-confirm-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/list-confirm-evidence
          if-no-files-found: error
          retention-days: 14
