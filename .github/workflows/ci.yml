# 日常只保留一个Linux检查；三平台发布由main上的v* tag专门触发。
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  # 同仓库同分支的push/PR共享一个槽位；fork分支按仓库区分，避免相互取消。
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  UseSharedCompilation: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version-file: tests/pinned-python.txt
      - name: Native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev patchelf binutils
      - name: Release tag guard and portable download regressions
        run: |
          python -B scripts/test_release_tag.py
          python -B tests/cpython/test_portable.py
      - name: Check source and runtime
        # 差分oracle要求绝对解释器路径；make在无uv时的python3回退不满足该合同。
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          RYUPY_FOREACH_PYTHON: ${{ steps.python.outputs.python-path }}
        run: make check
