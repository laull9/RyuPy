# dev 的独立 NativeAOT 管线门：同次 CPython 预期，不依赖已清理的 golden。
name: Dev NativeAOT validation

on:
  push:
    branches: [dev, ci/aot-manifest-contract-68f5ecd]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-dev-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  UseSharedCompilation: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    # 冷构建30分钟 + 管线32分钟，另留18分钟给安装与失败工件收尾。
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version-file: tests/pinned-python.txt
      - name: Lightweight runner and artifact regressions
        run: |
          python -B tests/aot/test_runner.py
          python -B tests/aot/test_aot_layout.py
          python -B tests/test_bench_aot.py
          python -B tests/aot/test_bench_smoke.py
          python -B tests/aot/test_bench_relocation.py
          python -B -m unittest discover -s tests/aot -p 'test_manifest_*.py'
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Build isolated release compiler and runtime
        # 独立临时target不依赖缓存命中；这是保守预算，不是实测构建耗时。
        timeout-minutes: 30
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ryupy-aot-target
        run: |
          make runtime
          cargo build -p ryupy-cli --release --locked
      - name: Verify public hello NativeAOT pipeline and relocation
        timeout-minutes: 32
        run: |
          python -B tests/aot/bench_smoke.py \
            --target "$RUNNER_TEMP/ryupy-aot-target" \
            --out "$RUNNER_TEMP/aot-dev-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve evidence outside source Git, including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-dev-validation-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/aot-dev-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
