[package]
name = "ryupy-driver"
description = "编译流水线编排、产物布局与 dotnet 工具调用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# 仅隔离S2a测试产物；不用于默认项目或发布。
trace-adapter-test = ["ryupy-mir/trace-adapter-test", "ryupy-codegen-cil/trace-adapter-test"]
# 隔离JIT候选；尚未通过默认晋升条件，发行构建保持关闭。
ordinary-dynamic-module-pilot = []

[dependencies]
# 仅构建期文件身份；Windows 同目标仍只放行同一已验证 lexical 记录。
same-file = "1.0.6"
# 标准File锁要求更高MSRV；仅用于内嵌运行时的短暂原子缓存提交。
fs2 = "0.4.3"
ryupy-base.workspace = true
ryupy-syntax.workspace = true
ryupy-hir.workspace = true
ryupy-ty.workspace = true
ryupy-mir.workspace = true
ryupy-codegen-cil.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
