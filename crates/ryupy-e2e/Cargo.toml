[package]
name = "ryupy-e2e"
description = "端到端差分测试（CPython vs RyuPy），需要 python3 与 dotnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# 项目级运行入口（src/bin/projects.rs）需要真正调用编译流水线，
# 因此 driver 是普通依赖而不是 dev-dependency。
ryupy-driver.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true

[[test]]
name = "e2e"
harness = false

[lints]
workspace = true
